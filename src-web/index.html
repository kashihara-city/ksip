<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSIP</title><link rel="stylesheet" href="style.css"><script src="locales/ja.js" defer></script><script src="locales/en.js" defer></script><script src="locales/zh-TW.js" defer></script><script src="app.js" defer></script></head>
<body><main>
<header><div class="connection-summary"><i id="status-light"></i><div class="connection-lines"><div class="connection-identity"><span id="account-label"></span><span id="registration" role="status"></span></div><div class="connection-server" id="connection-server"><span id="server-label"></span><span id="transport-label" role="status"></span></div></div></div><nav class="header-actions" aria-label="" data-i18n-label="HEADER_ACTIONS"><button id="settings-button" class="text" data-i18n="SETTINGS_OPEN"></button><button id="reconnect" class="text" data-i18n="RECONNECT"></button><button id="unregister" class="text" data-i18n="UNREGISTER"></button><button id="quit" class="text" data-i18n="QUIT"></button></nav></header>
<section class="phone">
<div class="lines"><button id="line-1" aria-label="" aria-describedby="line-1-status" class="line selected" aria-pressed="true" data-i18n-label="LINE_1"><span class="line-title"><strong data-i18n="LINE_1"></strong><time id="line-1-duration">00:00</time></span><small id="line-1-status"></small><small id="line-1-peer" class="line-peer">—</small></button><button id="line-2" aria-label="" aria-describedby="line-2-status" class="line" aria-pressed="false" data-i18n-label="LINE_2"><span class="line-title"><strong data-i18n="LINE_2"></strong><time id="line-2-duration">00:00</time></span><small id="line-2-status"></small><small id="line-2-peer" class="line-peer">—</small></button><button id="transfer" aria-label="" class="transfer" disabled data-i18n-label="TRANSFER"><span data-i18n="TRANSFER"></span><br><small data-i18n="TRANSFER_DIRECTION"></small></button></div>
<form id="dial-form"><label for="target" class="sr-only" data-i18n="DIAL_TARGET"></label><input id="target" placeholder="" autocomplete="off" inputmode="tel" data-i18n-placeholder="DIAL_TARGET_PLACEHOLDER"><button id="dial" class="primary" disabled data-i18n="DIAL"></button></form>
<div class="call-actions"><button id="answer" class="primary" disabled data-i18n="ANSWER"></button><button id="hold" disabled data-i18n="HOLD"></button><button id="hangup" class="danger" disabled data-i18n="HANGUP"></button></div>
<div id="custom-actions" class="custom-actions" aria-label="" data-i18n-label="BUTTON_SECTION" hidden></div>
<p id="transfer-status" class="hint" role="status"></p>
<details class="keypad-wrap"><summary data-i18n="KEYPAD"></summary><div id="keypad" class="keypad"></div></details>
</section>
<section class="audio"><div><label for="microphone-volume"><span data-i18n="AUDIO_MICROPHONE"></span><output id="microphone-level">—</output></label><input id="microphone-volume" type="range" aria-label="" min="0" max="200" disabled data-i18n-label="AUDIO_MICROPHONE_VOLUME"><label class="sr-only" for="microphone" data-i18n="AUDIO_MICROPHONE_DEVICE"></label><select id="microphone" aria-label="" data-i18n-label="AUDIO_MICROPHONE_DEVICE"><option value="default" data-i18n="AUDIO_MICROPHONE_DEFAULT"></option></select><div class="audio-meter-row"><span data-i18n="AUDIO_INPUT_LEVEL"></span><div id="microphone-meter" class="audio-meter" role="meter" aria-label="" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-label="AUDIO_MICROPHONE_METER"><i id="microphone-meter-fill"></i></div></div><p id="microphone-volume-status" class="hint" role="status"></p></div><div><label for="speaker-volume"><span data-i18n="AUDIO_SPEAKER"></span><output id="speaker-level">—</output></label><input id="speaker-volume" type="range" aria-label="" min="0" max="200" disabled data-i18n-label="AUDIO_SPEAKER_VOLUME"><label class="sr-only" for="speaker" data-i18n="AUDIO_SPEAKER_DEVICE"></label><select id="speaker" aria-label="" data-i18n-label="AUDIO_SPEAKER_DEVICE"><option value="default" data-i18n="AUDIO_SPEAKER_DEFAULT"></option></select><div class="audio-meter-row"><span data-i18n="AUDIO_OUTPUT_LEVEL"></span><div id="speaker-meter" class="audio-meter" role="meter" aria-label="" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-label="AUDIO_SPEAKER_METER"><i id="speaker-meter-fill"></i></div></div><p id="speaker-volume-status" class="hint" role="status"></p></div><div class="audio-tools"><button id="refresh-devices" type="button" class="text" data-i18n="AUDIO_REFRESH"></button><button id="open-sound-control" type="button" class="text" data-i18n="AUDIO_CONTROL_PANEL"></button><span id="device-status" class="hint" role="status"></span></div></section>
<div class="recording"><button id="record" type="button" aria-pressed="false"></button><span id="record-status" role="status"></span><button id="open-recordings" class="text" data-i18n="RECORDINGS_FOLDER"></button></div>
<div id="error" class="alert" role="alert" hidden></div>
<footer class="aec-status"><div class="aec-heading"><span>AEC <b id="aec-label">ON</b><span id="codec-label" role="status"></span></span><strong id="aec-state" hidden></strong></div><div id="aec-metrics" role="status" hidden><span id="aec-core"></span><span id="aec-delay"></span><span id="aec-levels"></span><span id="aec-flow"></span></div></footer>
<section class="bottom-panel"><div class="panel-tabs" role="tablist"><button id="history-tab" class="text active" role="tab" aria-selected="true" aria-controls="call-history" data-i18n="PANEL_HISTORY"></button><button id="logs-tab" class="text" role="tab" aria-selected="false" aria-controls="logs" data-i18n="PANEL_LOGS"></button><span id="logs-paused" class="hint" role="status" data-i18n="LOGS_PAUSED" hidden></span><button id="clear-panel" class="text" data-i18n="PANEL_CLEAR"></button></div><div id="call-history" class="history" role="tabpanel"></div><pre id="logs" role="tabpanel" tabindex="0" hidden></pre></section>
</main>
<dialog id="configuration"><form id="settings-form"><div class="dialog-title"><h2 data-i18n="SETTINGS_TITLE"></h2><button id="close-settings" type="button" data-i18n="SETTINGS_CLOSE"></button></div>
<h3 data-i18n="SETTINGS_ACCOUNT"></h3><div class="row"><label><span data-i18n="SETTINGS_SERVER"></span><input id="server" required maxlength="253" placeholder="" data-i18n-placeholder="SETTINGS_SERVER_PLACEHOLDER"></label><label class="short"><span data-i18n="SETTINGS_PORT"></span><input id="port" type="number" min="1" max="65535" value="5060" required></label></div>
<div class="row"><label><span data-i18n="SETTINGS_EXTENSION"></span><input id="extension" autocomplete="username" maxlength="100" placeholder="" data-i18n-placeholder="SETTINGS_EXTENSION_PLACEHOLDER"></label><label><span data-i18n="SETTINGS_AUTH_USER"></span><input id="auth_user" required maxlength="100"></label></div>
<div class="row"><label><span data-i18n="SETTINGS_REGISTER_INTERVAL"></span><input id="register_interval" type="number" min="30" max="3600" step="1" required><span class="unit-hint" data-i18n="SETTINGS_SECONDS"></span></label><label><span data-i18n="SETTINGS_PASSWORD"></span><input id="password" type="password" autocomplete="new-password" maxlength="512"></label></div><p id="password-hint" class="hint" data-i18n="SETTINGS_PASSWORD_HINT"></p><div class="row"><label><span data-i18n="SETTINGS_TRANSPORT"></span><select id="transport"><option value="udp" data-i18n="SETTINGS_TRANSPORT_UDP"></option><option value="tls">TLS</option></select></label><label><span data-i18n="SETTINGS_MEDIA_ENCRYPTION"></span><select id="media_encryption"><option value="" data-i18n="SETTINGS_MEDIA_NONE"></option><option value="sdes">SRTP（SDES）</option><option value="dtls">SRTP（DTLS）</option></select></label></div><label class="sound-row"><span data-i18n="SETTINGS_CA_FILE"></span><input id="ca_file" maxlength="400" placeholder="" data-i18n-placeholder="SETTINGS_CA_FILE_PLACEHOLDER"><button type="button" id="choose-ca" class="text" data-i18n="BROWSE"></button></label><p class="hint" data-i18n="SETTINGS_TLS_HINT"></p>
<h3 data-i18n="SETTINGS_BUTTONS"></h3><p class="hint" data-i18n="SETTINGS_BUTTONS_HINT"></p><div class="button-grid"><span></span><span data-i18n="BUTTON_TITLE"></span><span data-i18n="BUTTON_KIND"></span><span data-i18n="BUTTON_NUMBER"></span><span data-i18n="BUTTON_TRANSFER"></span><span>1</span><input id="button_1_title" maxlength="40" aria-label="" data-i18n-label="BUTTON_TITLE"><select id="button_1_kind" aria-label="" data-i18n-label="BUTTON_KIND"><option value="" data-i18n="BUTTON_KIND_NONE"></option><option value="transfer" data-i18n="BUTTON_KIND_TRANSFER"></option><option value="dial" data-i18n="BUTTON_KIND_DIAL"></option><option value="park" data-i18n="BUTTON_KIND_PARK"></option><option value="open" data-i18n="BUTTON_KIND_OPEN"></option></select><input id="button_1_number" maxlength="500" aria-label="" data-i18n-label="BUTTON_NUMBER"><input id="button_1_transfer" maxlength="500" aria-label="" data-i18n-label="BUTTON_TRANSFER"><span>2</span><input id="button_2_title" maxlength="40" aria-label="" data-i18n-label="BUTTON_TITLE"><select id="button_2_kind" aria-label="" data-i18n-label="BUTTON_KIND"><option value="" data-i18n="BUTTON_KIND_NONE"></option><option value="transfer" data-i18n="BUTTON_KIND_TRANSFER"></option><option value="dial" data-i18n="BUTTON_KIND_DIAL"></option><option value="park" data-i18n="BUTTON_KIND_PARK"></option><option value="open" data-i18n="BUTTON_KIND_OPEN"></option></select><input id="button_2_number" maxlength="500" aria-label="" data-i18n-label="BUTTON_NUMBER"><input id="button_2_transfer" maxlength="500" aria-label="" data-i18n-label="BUTTON_TRANSFER"><span>3</span><input id="button_3_title" maxlength="40" aria-label="" data-i18n-label="BUTTON_TITLE"><select id="button_3_kind" aria-label="" data-i18n-label="BUTTON_KIND"><option value="" data-i18n="BUTTON_KIND_NONE"></option><option value="transfer" data-i18n="BUTTON_KIND_TRANSFER"></option><option value="dial" data-i18n="BUTTON_KIND_DIAL"></option><option value="park" data-i18n="BUTTON_KIND_PARK"></option><option value="open" data-i18n="BUTTON_KIND_OPEN"></option></select><input id="button_3_number" maxlength="500" aria-label="" data-i18n-label="BUTTON_NUMBER"><input id="button_3_transfer" maxlength="500" aria-label="" data-i18n-label="BUTTON_TRANSFER"><span>4</span><input id="button_4_title" maxlength="40" aria-label="" data-i18n-label="BUTTON_TITLE"><select id="button_4_kind" aria-label="" data-i18n-label="BUTTON_KIND"><option value="" data-i18n="BUTTON_KIND_NONE"></option><option value="transfer" data-i18n="BUTTON_KIND_TRANSFER"></option><option value="dial" data-i18n="BUTTON_KIND_DIAL"></option><option value="park" data-i18n="BUTTON_KIND_PARK"></option><option value="open" data-i18n="BUTTON_KIND_OPEN"></option></select><input id="button_4_number" maxlength="500" aria-label="" data-i18n-label="BUTTON_NUMBER"><input id="button_4_transfer" maxlength="500" aria-label="" data-i18n-label="BUTTON_TRANSFER"><span>5</span><input id="button_5_title" maxlength="40" aria-label="" data-i18n-label="BUTTON_TITLE"><select id="button_5_kind" aria-label="" data-i18n-label="BUTTON_KIND"><option value="" data-i18n="BUTTON_KIND_NONE"></option><option value="transfer" data-i18n="BUTTON_KIND_TRANSFER"></option><option value="dial" data-i18n="BUTTON_KIND_DIAL"></option><option value="park" data-i18n="BUTTON_KIND_PARK"></option><option value="open" data-i18n="BUTTON_KIND_OPEN"></option></select><input id="button_5_number" maxlength="500" aria-label="" data-i18n-label="BUTTON_NUMBER"><input id="button_5_transfer" maxlength="500" aria-label="" data-i18n-label="BUTTON_TRANSFER"><span>6</span><input id="button_6_title" maxlength="40" aria-label="" data-i18n-label="BUTTON_TITLE"><select id="button_6_kind" aria-label="" data-i18n-label="BUTTON_KIND"><option value="" data-i18n="BUTTON_KIND_NONE"></option><option value="transfer" data-i18n="BUTTON_KIND_TRANSFER"></option><option value="dial" data-i18n="BUTTON_KIND_DIAL"></option><option value="park" data-i18n="BUTTON_KIND_PARK"></option><option value="open" data-i18n="BUTTON_KIND_OPEN"></option></select><input id="button_6_number" maxlength="500" aria-label="" data-i18n-label="BUTTON_NUMBER"><input id="button_6_transfer" maxlength="500" aria-label="" data-i18n-label="BUTTON_TRANSFER"></div>
<h3 data-i18n="SETTINGS_AUDIO"></h3><div class="aec-setting"><label class="check"><input id="aec" type="checkbox" checked><span data-i18n="SETTINGS_AEC"></span></label><label class="aec-delay"><span data-i18n="SETTINGS_AEC_DELAY"></span><input id="aec_delay_ms" type="number" min="0" max="500" step="1" value="20" required><span>ms</span></label></div>
<section class="calibration"><strong data-i18n="SETTINGS_CALIBRATION"></strong><p class="hint" data-i18n="SETTINGS_CALIBRATION_HINT"></p><div class="calibration-actions"><button id="calibrate-aec" type="button" data-i18n="SETTINGS_CALIBRATION_SIMPLE"></button><button id="calibrate-aec-careful" type="button" data-i18n="SETTINGS_CALIBRATION_CAREFUL"></button></div><span id="calibration-status" class="hint" role="status" data-i18n="SETTINGS_CALIBRATION_IDLE"></span></section>
<p class="group-label" data-i18n="SETTINGS_SOUNDS"></p><p class="hint" data-i18n="SETTINGS_SOUNDS_HINT"></p><div class="sound-settings"><label class="sound-row"><span data-i18n="SETTINGS_SOUND_RING"></span><input id="sound_ring" maxlength="400" placeholder="" data-i18n-placeholder="SETTINGS_SOUND_PLACEHOLDER"><button type="button" class="text" data-sound="ring" data-i18n="BROWSE"></button></label><label class="sound-row"><span data-i18n="SETTINGS_SOUND_RINGBACK"></span><input id="sound_ringback" maxlength="400" placeholder="" data-i18n-placeholder="SETTINGS_SOUND_PLACEHOLDER"><button type="button" class="text" data-sound="ringback" data-i18n="BROWSE"></button></label><label class="sound-row"><span data-i18n="SETTINGS_SOUND_CALLWAITING"></span><input id="sound_callwaiting" maxlength="400" placeholder="" data-i18n-placeholder="SETTINGS_SOUND_PLACEHOLDER"><button type="button" class="text" data-sound="callwaiting" data-i18n="BROWSE"></button></label><label class="sound-row"><span data-i18n="SETTINGS_SOUND_BUSY"></span><input id="sound_busy" maxlength="400" placeholder="" data-i18n-placeholder="SETTINGS_SOUND_PLACEHOLDER"><button type="button" class="text" data-sound="busy" data-i18n="BROWSE"></button></label><label class="sound-row"><span data-i18n="SETTINGS_SOUND_NOTFOUND"></span><input id="sound_notfound" maxlength="400" placeholder="" data-i18n-placeholder="SETTINGS_SOUND_PLACEHOLDER"><button type="button" class="text" data-sound="notfound" data-i18n="BROWSE"></button></label><label class="sound-row"><span data-i18n="SETTINGS_SOUND_ERROR"></span><input id="sound_error" maxlength="400" placeholder="" data-i18n-placeholder="SETTINGS_SOUND_PLACEHOLDER"><button type="button" class="text" data-sound="error" data-i18n="BROWSE"></button></label></div>
<h3 data-i18n="SETTINGS_SHORTCUTS"></h3><label><span data-i18n="SETTINGS_SHORTCUT_WINDOW"></span><input id="shortcut_window" maxlength="60" placeholder="" data-i18n-placeholder="SETTINGS_SHORTCUT_PLACEHOLDER"></label><label><span data-i18n="SETTINGS_SHORTCUT_CALL"></span><input id="shortcut_call" maxlength="60" placeholder="" data-i18n-placeholder="SETTINGS_SHORTCUT_PLACEHOLDER"></label><p class="hint" data-i18n="SETTINGS_SHORTCUT_HINT"></p><h3 data-i18n="SETTINGS_BROWSER"></h3><label class="check"><input id="browser_integration" type="checkbox"><span data-i18n="SETTINGS_BROWSER_INTEGRATION"></span></label><p class="hint" data-i18n="SETTINGS_BROWSER_HINT"></p><label class="check"><input id="browser_dial_confirm" type="checkbox"><span data-i18n="SETTINGS_BROWSER_CONFIRM"></span></label><p class="hint" data-i18n="SETTINGS_BROWSER_CONFIRM_HINT"></p><h3 data-i18n="SETTINGS_INCOMING"></h3><label class="check"><input id="auto_answer" type="checkbox"><span data-i18n="SETTINGS_AUTO_ANSWER"></span></label><p class="hint" data-i18n="SETTINGS_AUTO_ANSWER_HINT"></p><label><span data-i18n="SETTINGS_INCOMING_ACTION"></span><select id="incoming_action"><option value="show" data-i18n="SETTINGS_INCOMING_SHOW"></option><option value="notify" data-i18n="SETTINGS_INCOMING_NOTIFY"></option></select></label><p class="hint" data-i18n="SETTINGS_INCOMING_HINT"></p><label><span data-i18n="SETTINGS_TRAY_AFTER_CALL"></span><input id="tray_after_call" type="number" min="-1" max="3600" step="1" required><span class="unit-hint" data-i18n="SETTINGS_SECONDS"></span></label><p class="hint" data-i18n="SETTINGS_TRAY_AFTER_CALL_HINT"></p>
<h3 data-i18n="SETTINGS_LANGUAGE"></h3><label><span data-i18n="SETTINGS_LANGUAGE_LABEL"></span><select id="language"><option value="" data-i18n="SETTINGS_LANGUAGE_SYSTEM"></option><!-- A language is named in its own words, so these are not translated. --><option value="ja">日本語</option><option value="en">English</option><option value="zh-TW">繁體中文</option></select></label><h3 data-i18n="SETTINGS_LOG"></h3><label class="check"><input id="detail_log" type="checkbox"><span data-i18n="SETTINGS_DETAIL_LOG"></span></label><p class="hint" data-i18n="SETTINGS_DETAIL_LOG_HINT"></p>
<details><summary data-i18n="SETTINGS_NETWORK"></summary><p class="hint" data-i18n="SETTINGS_NETWORK_HINT"></p><label><span data-i18n="SETTINGS_ADAPTER"></span><select id="network_adapter"></select></label><p class="hint" data-i18n="SETTINGS_ADAPTER_HINT"></p><div class="row"><label><span data-i18n="SETTINGS_SIP_PORT"></span><input id="sip_port" type="number" min="1024" max="65535" value="5060"></label><label><span data-i18n="SETTINGS_RTP_PORT"></span><input id="rtp_port" type="number" min="1024" max="65400" step="2" value="10000"></label></div></details>
<p class="hint" data-i18n="SETTINGS_SAVE_HINT"></p><div id="settings-error" class="alert" role="alert" hidden></div><button id="save-settings" class="primary wide" data-i18n="SETTINGS_SAVE"></button>
</form></dialog><dialog id="confirm" class="confirm"><p id="confirm-text"></p><div class="confirm-actions"><button id="confirm-cancel" type="button" data-i18n="CANCEL"></button><button id="confirm-ok" type="button" class="primary">OK</button></div></dialog></body></html>
